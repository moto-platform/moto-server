name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # moto-vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/moto-vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/moto-vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/moto-vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # moto-connectivity-node is public (D-033): the single-source schema is read
      # without a token. A failed fetch fails the job instead of skipping the check.
      - name: Fetch BLE schema source (moto-connectivity-node)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ble_schema.json" \
            https://raw.githubusercontent.com/moto-platform/moto-connectivity-node/main/docs/ble_telemetry_packet_schema.json
          echo "MOTO_CONN_SCHEMA=$RUNNER_TEMP/ble_schema.json" >> "$GITHUB_ENV"
          echo "MOTO_SCHEMA_DRIFT_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest

      - name: Docker Compose config (smoke check)
        run: docker compose config
        env:
          MOTO_API_TOKEN: ci-smoke-check-placeholder
