name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # moto-vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show the defs pin
        run: git -C external/moto-vehicle-defs describe --tags --always

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # moto-connectivity-node is public (D-033): the single-source schema is read
      # without a token. A failed fetch fails the job instead of skipping the check.
      - name: Fetch BLE schema source (moto-connectivity-node)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ble_schema.json" \
            https://raw.githubusercontent.com/moto-platform/moto-connectivity-node/main/docs/ble_telemetry_packet_schema.json
          echo "MOTO_CONN_SCHEMA=$RUNNER_TEMP/ble_schema.json" >> "$GITHUB_ENV"
          echo "MOTO_SCHEMA_DRIFT_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest

      - name: Docker Compose config (smoke check)
        run: docker compose config
        env:
          MOTO_API_TOKEN: ci-smoke-check-placeholder
