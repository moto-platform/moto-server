name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"
          # The Docker fallback reports this file when the image has no .git (ISSUES E-25 (1)).
          test "$(cat src/vehicle_server/defs_pin.txt)" = "$tag" || { echo "::error::src/vehicle_server/defs_pin.txt does not name the defs pin $tag"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Docker Compose config (smoke check)
        run: docker compose config
        env:
          VEHICLE_API_TOKEN: ci-smoke-check-placeholder
