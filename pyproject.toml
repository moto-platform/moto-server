[project]
name = "vehicle-server"
version = "0.6.0"
description = "Ingestion, storage and validation of vehicle-platform ride sessions (D-010)."
readme = "README.md"
authors = [{ name = "vehicle-platform" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# MDF4 export (mdf4.py). asammdf is LGPL-3.0+, so it stays out of the default
# install and the Docker image (D-091).
mdf4 = ["asammdf>=8.8.28"]

[project.scripts]
vehicle-server = "vehicle_server.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "asammdf>=8.8.28",  # same pin as the mdf4 extra, so tests cover the export
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
