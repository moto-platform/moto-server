services:
  vehicle-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      VEHICLE_API_TOKEN: ${VEHICLE_API_TOKEN:?set VEHICLE_API_TOKEN in the environment or a .env file}
      VEHICLE_DATA_DIR: /data
      VEHICLE_MAX_UPLOAD_MB: ${VEHICLE_MAX_UPLOAD_MB:-100}
    volumes:
      - vehicle-server-data:/data

volumes:
  vehicle-server-data:
